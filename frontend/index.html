<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Emotion Detection</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <div class="container">

        <h1>Real-Time Emotion Detection</h1>

        <!-- Controls -->

        <div class="controls">

            <button id="startBtn">
                Start Camera
            </button>

            <button id="stopBtn">
                Stop Camera
            </button>

        </div>

        <!-- Model Toggle -->

        <div class="model-select">

            <label>

                <input type="radio"
                       name="model"
                       value="custom"
                       checked>

                Custom CNN

            </label>

            <label>

                <input type="radio"
                       name="model"
                       value="mobilenet">

                MobileNetV2

            </label>

        </div>

        <!-- Video -->

        <video id="video"
            autoplay
            playsinline>
        </video>

        <!-- Hidden processing canvas -->
        <canvas id="canvas" style="display:none;"></canvas>

        <!-- Prediction -->

        <div class="prediction">

            <h2 id="emotion">
                Emotion: -
            </h2>

            <h3 id="confidence">
                Confidence: -
            </h3>

        </div>

        <!-- Probability Bars -->

        <div class="bars-container">

            <div class="bar">
                <span>Angry</span>
                <div class="progress">
                    <div id="angryBar"></div>
                </div>
            </div>

            <div class="bar">
                <span>Disgust</span>
                <div class="progress">
                    <div id="disgustBar"></div>
                </div>
            </div>

            <div class="bar">
                <span>Fear</span>
                <div class="progress">
                    <div id="fearBar"></div>
                </div>
            </div>

            <div class="bar">
                <span>Happy</span>
                <div class="progress">
                    <div id="happyBar"></div>
                </div>
            </div>

            <div class="bar">
                <span>Neutral</span>
                <div class="progress">
                    <div id="neutralBar"></div>
                </div>
            </div>

            <div class="bar">
                <span>Sad</span>
                <div class="progress">
                    <div id="sadBar"></div>
                </div>
            </div>

            <div class="bar">
                <span>Surprise</span>
                <div class="progress">
                    <div id="surpriseBar"></div>
                </div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>

</body>

</html>
